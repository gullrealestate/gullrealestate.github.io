name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Setup Cachix Cache
        uses: cachix/cachix-action@v17
        with:
          name: devenv

      - name: Install devenv binary
        run: nix profile install nixpkgs#devenv

      - name: Verify devenv version
        run: devenv version

      - name: Install dependencies
        run: devenv shell -- npm ci

      - name: Lint
        run: devenv shell -- npm run lint

      - name: Test & Coverage
        run: devenv shell -- npm run test:coverage

      - name: Build
        run: |
          # Build includes tsc, vite build, prerender, and sitemap generation
          devenv shell -- npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
